name = "my-family-tree"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "TREE_KV"
id = "placeholder-kv-id"

[vars]
GUEST_PASSWORD_HASH = "PLACEHOLDER_GUEST_HASH"
ADMIN_PASSWORD_HASH = "PLACEHOLDER_ADMIN_HASH"
# R5: subscription freeze flag. Set to "false" to freeze the tree
# (e.g. lapsed support subscription) without deleting any data.
TREE_ACTIVE = "true"
FAMILY_NAME_RU = "PLACEHOLDER_FAMILY_NAME"
FAMILY_SLUG = "PLACEHOLDER_FAMILY_SLUG"
CALENDAR_UID_DOMAIN = "PLACEHOLDER_CALENDAR_UID_DOMAIN"

[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "placeholder-photos-bucket-name"
